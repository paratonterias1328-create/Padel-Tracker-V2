<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#101114" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Padel Tracker" />
  <link rel="manifest" href="manifest.webmanifest">
  <title>Padel Tracker</title>
  <style>
    :root{
      --bg:#0f1115; --panel:#171a21; --panel2:#20242d; --text:#f5f7fb; --muted:#9aa3b2;
      --line:#2d3340; --good:#31c48d; --bad:#f05252; --warn:#f6ad55; --accent:#5b8cff; --purple:#a78bfa;
      --radius:18px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input{font:inherit}
    .app{max-width:760px;margin:0 auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 12px) 12px calc(env(safe-area-inset-bottom) + 20px)}
    .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
    .brand{font-weight:800;font-size:18px}
    .small{font-size:12px;color:var(--muted)}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
    .screen{display:none}.screen.active{display:block}
    h1,h2,h3,p{margin-top:0}
    .setup{display:grid;gap:14px}
    label{font-size:13px;color:var(--muted);display:grid;gap:7px}
    input{width:100%;border:1px solid var(--line);background:#0c0e12;color:var(--text);border-radius:14px;padding:14px 15px;font-size:16px}
    .primary,.secondary,.danger{border:none;border-radius:15px;padding:14px 16px;font-weight:800}
    .primary{background:var(--accent);color:white}.secondary{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
    .danger{background:#3a1719;color:#ffb4b4;border:1px solid #6b2529}
    .match-head{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;margin-bottom:10px}
    .player-title{font-weight:900;text-align:center;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .score-meta{text-align:center;color:var(--muted);font-size:12px;line-height:1.35}
    .players{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .player{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px}
    .btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .stat-btn{min-height:92px;border:1px solid var(--line);border-radius:16px;background:var(--panel2);color:var(--text);padding:8px 6px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-weight:800;touch-action:manipulation}
    .stat-btn:active{transform:scale(.97)}
    .stat-btn .n{font-size:22px}
    .stat-btn .label{font-size:11px;line-height:1.1;text-align:center}
    .stat-btn.good{box-shadow:inset 0 0 0 1px rgba(49,196,141,.22)}
    .stat-btn.bad{box-shadow:inset 0 0 0 1px rgba(240,82,82,.25)}
    .stat-btn.warn{box-shadow:inset 0 0 0 1px rgba(246,173,85,.25)}
    .stat-btn.accent{box-shadow:inset 0 0 0 1px rgba(91,140,255,.25)}
    .bottom-metric{margin-top:10px;padding:12px 8px;background:#0c0e12;border-radius:15px;text-align:center}
    .bottom-metric strong{font-size:28px}.bottom-metric div{font-size:11px;color:var(--muted)}
    .controls{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .controls button{min-height:48px}
    .controls .wide{grid-column:1/-1}
    .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:#050608;border:1px solid var(--line);padding:10px 14px;border-radius:12px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}
    .toast.show{opacity:1}
    .dash-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
    .tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:9px 12px}
    .tab.active{background:var(--accent);border-color:var(--accent)}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .metric-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
    .metric-card .name{font-size:11px;color:var(--muted);margin-bottom:5px}.metric-card .value{font-size:24px;font-weight:900}
    .section-title{font-size:14px;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.07em}
    .history-item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
    .history-item:last-child{border-bottom:0}
    .history-main{min-width:0}.history-main strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.history-main span{font-size:12px;color:var(--muted)}
    .empty{color:var(--muted);text-align:center;padding:25px 6px}
    .spark{display:flex;align-items:flex-end;height:90px;gap:4px;padding-top:8px}
    .bar{flex:1;min-width:5px;border-radius:5px 5px 2px 2px;background:linear-gradient(180deg,#5b8cff,#345acb);opacity:.9}
    .legend{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:5px}
    .nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
    .player-select{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}
    .player-select button{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:14px;padding:12px;font-weight:800}
    .player-select button.active{background:var(--accent);border-color:var(--accent)}
    .hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .hero{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
    .hero .k{font-size:11px;color:var(--muted);margin-bottom:5px}.hero .v{font-size:25px;font-weight:900}
    .bars{display:grid;gap:10px;margin-top:8px}
    .barrow{display:grid;grid-template-columns:125px 1fr 38px;gap:8px;align-items:center}
    .barlabel{font-size:12px;color:var(--muted)}
    .track{height:12px;background:#0c0e12;border-radius:999px;overflow:hidden;border:1px solid var(--line)}
    .fill{height:100%;border-radius:999px}
    .fill.good{background:var(--good)} .fill.bad{background:var(--bad)}
    .fill.warn{background:var(--warn)} .fill.accent{background:var(--accent)}
    .fill.purple{background:var(--purple)}
    .barval{text-align:right;font-size:12px;font-weight:800}
    .donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
    .donut{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;position:relative}
    .donut::after{content:"";width:88px;height:88px;border-radius:50%;background:var(--panel);position:absolute}
    .donut .center{z-index:1;text-align:center}.donut .center strong{display:block;font-size:24px}.donut .center span{font-size:10px;color:var(--muted)}
    .legend-list{display:grid;gap:7px}.legend-item{display:flex;justify-content:space-between;gap:8px;font-size:12px}
    .legend-name{display:flex;gap:7px;align-items:center}.dot{width:9px;height:9px;border-radius:50%}
    .timeline{display:flex;gap:3px;align-items:center;overflow:auto;padding:8px 0 3px}
    .eventdot{width:9px;height:28px;border-radius:5px;flex:0 0 auto}
    .modifier-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:7px}
    .modifier-btn{min-height:52px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);color:var(--text);font-weight:900}
    .modifier-btn.warn{box-shadow:inset 0 0 0 1px rgba(246,173,85,.30)}
    .modifier-btn.purple{box-shadow:inset 0 0 0 1px rgba(167,139,250,.30)}
    .modifier-btn.active{outline:2px solid var(--accent);background:#111827}
    .pending-box{margin-top:7px;padding:9px 10px;border:1px dashed var(--accent);border-radius:12px;font-size:11px;text-align:center;color:var(--text)}
    .pending-box button{margin-left:6px;border:none;border-radius:9px;padding:5px 8px;background:var(--panel2);color:var(--text)}

    @media(max-width:430px){.hero-grid{grid-template-columns:1fr 1fr}.donut-wrap{grid-template-columns:1fr}.donut{margin:auto}.barrow{grid-template-columns:105px 1fr 32px}}

    @media (max-width:430px){
      .app{padding-left:8px;padding-right:8px}
      .players{gap:6px}.player{padding:7px}.btn-grid{gap:6px}
      .stat-btn{min-height:86px}.stat-btn .label{font-size:10px}.player-title{font-size:16px}
      .match-head{grid-template-columns:1fr 78px 1fr}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div>
      <div class="brand">PADEL TRACKER</div>
      <div class="small">Consistencia · Errores · Winners · v3</div>
    </div>
    <button id="homeBtn" class="secondary" style="padding:9px 12px">Inicio</button>
  </div>

  <section id="home" class="screen active">
    <div class="card">
      <h2>Nuevo partido</h2>
      <div class="setup">
        <label>Jugador 1<input id="p1name" placeholder="Jugador 1" value="Jugador 1"></label>
        <label>Jugador 2<input id="p2name" placeholder="Jugador 2" value="Jugador 2"></label>
        <button id="startBtn" class="primary">Empezar partido</button>
      </div>
    </div>
    <div class="section-title">Historial</div>
    <div id="history" class="card"></div>
  </section>

  <section id="match" class="screen">
    <div class="match-head">
      <div id="p1title" class="player-title"></div>
      <div class="score-meta"><div id="setGame">Set 1 · Juego 1</div><div id="elapsed">00:00</div></div>
      <div id="p2title" class="player-title"></div>
    </div>
    <div class="players">
      <div class="player" id="p1panel"></div>
      <div class="player" id="p2panel"></div>
    </div>
    <div class="controls">
      <button id="undoBtn" class="secondary">↶ Deshacer</button>
      <button id="gameBtn" class="secondary">Fin de juego</button>
      <button id="setBtn" class="secondary">Fin de set</button>
      <button id="finishBtn" class="danger">Finalizar partido</button>
    </div>
  </section>

  <section id="dashboard" class="screen">
    <div class="dash-head">
      <div>
        <h2 id="dashTitle" style="margin-bottom:4px">Resumen</h2>
        <div id="dashDate" class="small"></div>
      </div>
      <button id="backHistoryBtn" class="secondary">Historial</button>
    </div>
    <div id="filterTabs" class="tabs"></div>
    <div id="dashboardContent"></div>
  </section>
</div>
<div id="toast" class="toast"></div>

<script>
const OUTCOMES = [
  {key:'in', label:'Bola dentro', cls:'good'},
  {key:'ue', label:'Error no forzado', cls:'bad'},
  {key:'winner', label:'Winner', cls:'accent'},
  {key:'returnErr', label:'Error en el resto', cls:'bad'},
  {key:'df', label:'Doble falta', cls:'bad'}
];
const MODIFIERS = [
  {key:'ficha', label:'Ficha', cls:'warn'},
  {key:'smash', label:'Smash', cls:'purple'}
];
let state = { current:null, tick:null, dashMatch:null, filter:{type:'match'}, dashPlayer:0, pending:[null,null] };

const $ = id => document.getElementById(id);
function uid(){ return crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2); }
function saveMatches(matches){ localStorage.setItem('padelMatches', JSON.stringify(matches)); }
function getMatches(){ return JSON.parse(localStorage.getItem('padelMatches') || '[]'); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active')); $(id).classList.add('active'); }
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),1100); }
function fmtDate(iso){ return new Intl.DateTimeFormat('es-ES',{dateStyle:'medium',timeStyle:'short'}).format(new Date(iso)); }
function elapsed(ms){ let s=Math.floor(ms/1000); let m=Math.floor(s/60); s%=60; return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }

function newMatch(){
  const p1=$('p1name').value.trim() || 'Jugador 1';
  const p2=$('p2name').value.trim() || 'Jugador 2';
  state.current={id:uid(), players:[p1,p2], startedAt:new Date().toISOString(), endedAt:null, set:1, game:1, events:[], boundaries:[]}; state.pending=[null,null];
  renderMatch();
  showScreen('match');
  startClock();
}
function startClock(){
  clearInterval(state.tick);
  const started=new Date(state.current.startedAt).getTime();
  state.tick=setInterval(()=> $('elapsed').textContent=elapsed(Date.now()-started),1000);
}
function countsFor(player, events){
  const c={in:0,ue:0,winner:0,returnErr:0,df:0};
  events.filter(e=>e.player===player).forEach(e=>{ if(c[e.type]!==undefined) c[e.type]++; });
  return c;
}
function totalHits(c){ return Object.values(c).reduce((a,b)=>a+b,0); }
function ballsPlayed(c){ return c.in+c.ue+c.winner+c.returnErr+c.df; }
function consistency(c){
  const denom=ballsPlayed(c); if(!denom) return 0;
  const successful = c.in + c.winner;
  return Math.round(successful/denom*100);
}
function playerPanel(idx){
  const c=countsFor(idx,state.current.events);
  const p=state.pending[idx];
  const outcomeButtons = OUTCOMES.map(t=>{
    const allowed = !p || ['in','ue','winner'].includes(t.key);
    return `<button class="stat-btn ${t.cls}" data-p="${idx}" data-t="${t.key}" ${allowed?'':'disabled style="opacity:.35"'}>
      <span class="n">${c[t.key]}</span><span class="label">${t.label}</span>
    </button>`;
  }).join('');
  const modifierButtons = MODIFIERS.map(t=>`<button class="modifier-btn ${t.cls} ${p===t.key?'active':''}" data-mp="${idx}" data-m="${t.key}">${t.label}</button>`).join('');
  return `<div class="btn-grid">${outcomeButtons}</div>
    <div class="modifier-row">${modifierButtons}</div>
    ${p?`<div class="pending-box">${p==='ficha'?'Ficha':'Smash'} seleccionado → indica el resultado
      <button data-cancelp="${idx}">Cancelar</button></div>`:''}
    <div class="bottom-metric"><strong>${consistency(c)}%</strong><div>Golpes sin error / golpes registrados</div></div>`;
}
function renderMatch(){
  $('p1title').textContent=state.current.players[0]; $('p2title').textContent=state.current.players[1];
  $('setGame').textContent=`Set ${state.current.set} · Juego ${state.current.game}`;
  $('p1panel').innerHTML=playerPanel(0); $('p2panel').innerHTML=playerPanel(1);
  document.querySelectorAll('.stat-btn').forEach(b=>b.onclick=()=>addEvent(+b.dataset.p,b.dataset.t));
  document.querySelectorAll('.modifier-btn').forEach(b=>b.onclick=()=>setModifier(+b.dataset.mp,b.dataset.m));
  document.querySelectorAll('[data-cancelp]').forEach(b=>b.onclick=()=>{state.pending[+b.dataset.cancelp]=null;renderMatch();});
}
function setModifier(player,modifier){
  state.pending[player] = state.pending[player]===modifier ? null : modifier;
  renderMatch();
}
function addEvent(player,type){
  const modifier=state.pending[player];
  if(modifier && !['in','ue','winner'].includes(type)){ toast('Tras Ficha/Smash selecciona Bola dentro, Error o Winner'); return; }
  state.current.events.push({id:uid(),ts:new Date().toISOString(),player,type,modifier:modifier||null,set:state.current.set,game:state.current.game});
  state.pending[player]=null;
  renderMatch(); if(navigator.vibrate) navigator.vibrate(12);
}
function undo(){
  if(state.pending[0] || state.pending[1]){ state.pending=[null,null]; renderMatch(); toast('Selección cancelada'); return; }
  const e=state.current.events.pop(); if(e){ renderMatch(); toast('Última acción deshecha'); } else toast('No hay acciones');
}
function endGame(){
  state.pending=[null,null];
  state.current.boundaries.push({type:'game',set:state.current.set,game:state.current.game,ts:new Date().toISOString()});
  state.current.game++; renderMatch(); toast('Juego guardado');
}
function endSet(){
  state.pending=[null,null];
  state.current.boundaries.push({type:'set',set:state.current.set,game:state.current.game,ts:new Date().toISOString()});
  state.current.set++; state.current.game=1; renderMatch(); toast('Set guardado');
}
function finishMatch(){
  if(!confirm('¿Finalizar y guardar el partido?')) return;
  clearInterval(state.tick); state.current.endedAt=new Date().toISOString();
  const matches=getMatches(); matches.unshift(state.current); saveMatches(matches);
  state.dashMatch=state.current; state.current=null; state.filter={type:'match'}; state.dashPlayer=0;
  renderDashboard(); showScreen('dashboard'); renderHistory();
}
function renderHistory(){
  const matches=getMatches(), el=$('history');
  if(!matches.length){ el.innerHTML='<div class="empty">Todavía no hay partidos guardados.</div>'; return; }
  el.innerHTML=matches.map(m=>`<div class="history-item">
    <div class="history-main"><strong>${m.players[0]} vs ${m.players[1]}</strong><span>${fmtDate(m.startedAt)} · ${m.events.length} registros</span></div>
    <button class="secondary openMatch" data-id="${m.id}" style="padding:9px 11px">Ver</button>
  </div>`).join('');
  document.querySelectorAll('.openMatch').forEach(b=>b.onclick=()=>openDashboard(b.dataset.id));
}
function openDashboard(id){
  state.dashMatch=getMatches().find(m=>m.id===id); state.filter={type:'match'}; state.dashPlayer=0;
  renderDashboard(); showScreen('dashboard');
}
function filteredEvents(m){
  if(state.filter.type==='match') return m.events;
  if(state.filter.type==='set') return m.events.filter(e=>e.set===state.filter.set);
  if(state.filter.type==='game') return m.events.filter(e=>e.set===state.filter.set && e.game===state.filter.game);
}
function filtersFor(m){
  const sets=[...new Set(m.events.map(e=>e.set))].sort((a,b)=>a-b);
  let html=`<button class="tab ${state.filter.type==='match'?'active':''}" data-f="match">Partido</button>`;
  sets.forEach(s=>html+=`<button class="tab ${state.filter.type==='set'&&state.filter.set===s?'active':''}" data-f="set" data-s="${s}">Set ${s}</button>`);
  return html;
}
function metricRows(c){
  const total=ballsPlayed(c), gifted=c.ue+c.returnErr+c.df;
  const err100=total?Math.round(gifted/total*100):0;
  const ratio=c.ue? (c.winner/c.ue).toFixed(2) : (c.winner ? '∞' : '0');
  return [
    ['Golpes registrados',total],['Bolas dentro',c.in],['Errores no forzados',c.ue],
    ['Winners',c.winner],['Fichas',c.ficha],['Errores de resto',c.returnErr],
    ['Dobles faltas',c.df],['Puntos regalados',gifted],['% golpes sin error',consistency(c)+'%'],
    ['Errores / 100 golpes',err100],['Winners / ENF',ratio]
  ];
}
function pct(n,d){ return d ? Math.round(n/d*100) : 0; }
function modifierStats(player, events, modifier){
  const arr=events.filter(e=>e.player===player && e.modifier===modifier);
  return {
    total:arr.length,
    in:arr.filter(e=>e.type==='in').length,
    ue:arr.filter(e=>e.type==='ue').length,
    winner:arr.filter(e=>e.type==='winner').length
  };
}
function dashboardForPlayer(m, idx, ev){
  const c=countsFor(idx,ev), total=ballsPlayed(c), gifted=c.ue+c.returnErr+c.df;
  const ficha=modifierStats(idx,ev,'ficha');
  const smash=modifierStats(idx,ev,'smash');
  const max=Math.max(1,c.in,c.ue,c.winner,c.returnErr,c.df);
  const rows=[
    ['Bola dentro',c.in,'good'],['Winner',c.winner,'accent'],
    ['Error no forzado',c.ue,'bad'],['Error en el resto',c.returnErr,'purple'],['Doble falta',c.df,'bad']
  ];
  const success=c.in+c.winner;
  const fail=gifted;
  const successPct=pct(success,total);
  const donut=`conic-gradient(var(--good) 0 ${successPct}%, var(--bad) ${successPct}% 100%)`;
  const labelMap={in:'Bola dentro',winner:'Winner',ue:'Error no forzado',returnErr:'Error resto',df:'Doble falta'};
  const dots=ev.filter(e=>e.player===idx).slice(-80).map(e=>{
    const cls={in:'good',winner:'accent',ue:'bad',returnErr:'purple',df:'bad'}[e.type];
    const col={good:'var(--good)',accent:'var(--accent)',bad:'var(--bad)',purple:'var(--purple)'}[cls];
    const mod=e.modifier?` · ${e.modifier==='ficha'?'Ficha':'Smash'}`:'';
    return `<span class="eventdot" style="background:${col}" title="${labelMap[e.type]||e.type}${mod}"></span>`;
  }).join('');
  const modifierCard=(title,s,cls)=>`
    <div class="card">
      <h3 style="margin-bottom:10px">${title}</h3>
      <div class="hero-grid">
        <div class="hero"><div class="k">Intentos</div><div class="v">${s.total}</div></div>
        <div class="hero"><div class="k">Entran</div><div class="v">${s.in}</div></div>
        <div class="hero"><div class="k">Winners</div><div class="v">${s.winner}</div></div>
        <div class="hero"><div class="k">Falladas</div><div class="v">${s.ue}</div></div>
        <div class="hero"><div class="k">% éxito</div><div class="v">${pct(s.in+s.winner,s.total)}%</div></div>
        <div class="hero"><div class="k">% winner</div><div class="v">${pct(s.winner,s.total)}%</div></div>
      </div>
    </div>`;
  return `
    <div class="hero-grid">
      <div class="hero"><div class="k">Golpes registrados</div><div class="v">${total}</div></div>
      <div class="hero"><div class="k">Golpes sin error</div><div class="v">${successPct}%</div></div>
      <div class="hero"><div class="k">Puntos regalados</div><div class="v">${gifted}</div></div>
      <div class="hero"><div class="k">Winners</div><div class="v">${c.winner}</div></div>
      <div class="hero"><div class="k">Errores no forzados</div><div class="v">${c.ue}</div></div>
      <div class="hero"><div class="k">Fichas / Smash</div><div class="v">${ficha.total} / ${smash.total}</div></div>
    </div>
    <div class="section-title">Distribución de golpes</div>
    <div class="card">
      <div class="bars">${rows.map(([name,v,cls])=>`
        <div class="barrow"><div class="barlabel">${name}</div><div class="track"><div class="fill ${cls}" style="width:${Math.round(v/max*100)}%"></div></div><div class="barval">${v}</div></div>
      `).join('')}</div>
    </div>
    <div class="section-title">Consistencia</div>
    <div class="card donut-wrap">
      <div class="donut" style="background:${donut}"><div class="center"><strong>${successPct}%</strong><span>sin error</span></div></div>
      <div class="legend-list">
        <div class="legend-item"><div class="legend-name"><span class="dot" style="background:var(--good)"></span>Golpes sin error</div><strong>${success}</strong></div>
        <div class="legend-item"><div class="legend-name"><span class="dot" style="background:var(--bad)"></span>Errores que regalan punto</div><strong>${fail}</strong></div>
        <div class="legend-item"><div class="legend-name"><span class="dot" style="background:var(--accent)"></span>Winners</div><strong>${c.winner}</strong></div>
      </div>
    </div>
    <div class="section-title">Golpes de riesgo</div>
    <div style="display:grid;gap:10px">
      ${modifierCard('Ficha',ficha,'warn')}
      ${modifierCard('Smash',smash,'purple')}
    </div>
    <div class="section-title">Secuencia reciente</div>
    <div class="card"><div class="timeline">${dots || '<span class="small">Sin eventos en este filtro.</span>'}</div></div>
  `;
}
function renderDashboard(){
  const m=state.dashMatch; if(!m) return;
  $('dashTitle').textContent=`${m.players[0]} vs ${m.players[1]}`; $('dashDate').textContent=fmtDate(m.startedAt);
  $('filterTabs').innerHTML=filtersFor(m);
  document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
    state.filter=t.dataset.f==='match'?{type:'match'}:{type:'set',set:+t.dataset.s}; renderDashboard();
  });
  const ev=filteredEvents(m);
  $('dashboardContent').innerHTML=`
    <div class="player-select">
      <button id="selP1" class="${state.dashPlayer===0?'active':''}">${m.players[0]}</button>
      <button id="selP2" class="${state.dashPlayer===1?'active':''}">${m.players[1]}</button>
    </div>
    ${dashboardForPlayer(m,state.dashPlayer,ev)}
  `;
  $('selP1').onclick=()=>{state.dashPlayer=0;renderDashboard();};
  $('selP2').onclick=()=>{state.dashPlayer=1;renderDashboard();};
}
$('startBtn').onclick=newMatch;
$('undoBtn').onclick=undo; $('gameBtn').onclick=endGame; $('setBtn').onclick=endSet; $('finishBtn').onclick=finishMatch;
$('homeBtn').onclick=()=>{ renderHistory(); showScreen('home'); };
$('backHistoryBtn').onclick=()=>{ renderHistory(); showScreen('home'); };
renderHistory();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js').catch(()=>{}); }
</script>
</body>
</html>
